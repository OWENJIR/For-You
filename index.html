<!DOCTYPE html>
<html lang="id">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Halaman Utama</title>
   <style>
       body {
           text-align: center;
           background-image: url('background.jpeg'); /* Path to your image */
           background-size: cover; /* Make sure the image covers the whole background */
           background-position: center; /* Center the image */
           font-family: 'Arial', sans-serif;
           color: rgb(244, 248, 249);
           padding: 50px;
       }
       h1 {
           font-size: 2em;
       }
       button {
           background-color: rgba(86, 121, 236, 0.7); /* Semi-transparent background */
           padding: 15px 30px;
           font-size: 16px;
           cursor: pointer;
           border-radius: 10px;
           border: none;
           transition: background-color 0.3s ease;
       }
       button:hover {
           background-color: rgba(86, 121, 236, 0.7); /* Full opacity on hover */
       }
   </style>
</head>
<body>

   <h1>Hey there, friend! Just wanted to check in—how are you doing? If you're up for it, tap the button below!</h1>
   <img src="kucing kepo.jpeg" style="width: 300px; display: block; margin: 0 auto;" alt="kucing lucu">
   <button onclick="window.location.href='question.html';" style="display: block; margin: 20px auto;">Button</button>

</body>
</html>
